[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-tools"
version = "0.2.0"
description = "Load Home Assistant recorder data into pandas for Jupyter analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "jodli" }]
requires-python = ">=3.11"
dependencies = [
    "pymysql>=1.1.0",
    "pandas>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.6.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "types-PyMySQL",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["ha_tools"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ha_tools --cov-report=term-missing"
pythonpath = ["."]
